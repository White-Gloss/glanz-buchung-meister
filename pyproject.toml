[project]
name = "white_gloss_os"
authors = [
    { name = "WHITE GLOSS", email = "info@white-gloss.de" }
]
description = "WHITE GLOSS operational vehicle and detailing-order model for ERPNext"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
