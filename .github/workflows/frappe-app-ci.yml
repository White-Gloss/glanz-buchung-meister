name: Frappe App CI

on:
  push:
    branches:
      - frappe-app-v16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - name: Validate Python syntax
        run: python -m compileall -q white_gloss_os
      - name: Validate JSON metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('white_gloss_os').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'OK {path}')
          PY
      - name: Validate pyproject
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml','rb')); print('pyproject OK')"
      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check --quiet build flit_core
          python -m build --wheel
