name: Domain Migration Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/audit-domain-migration.mjs"
      - ".github/workflows/domain-migration-audit.yml"
  schedule:
    - cron: "41 5 * * *"

permissions:
  contents: read

concurrency:
  group: domain-migration-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Alte Domain und Weiterleitungen prüfen
        run: node scripts/audit-domain-migration.mjs
        env:
          MIGRATION_OLD_BASE: https://whitegloss.de
          MIGRATION_NEW_BASE: https://white-gloss.de
          MIGRATION_TIMEOUT_MS: "15000"
