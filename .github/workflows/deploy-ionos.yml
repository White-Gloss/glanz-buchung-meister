name: Deploy to IONOS VPS

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ionos-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.IONOS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      IONOS_SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
      IONOS_SSH_USER: ${{ secrets.IONOS_SSH_USER }}
      IONOS_SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}
      IONOS_SSH_KNOWN_HOSTS: ${{ secrets.IONOS_SSH_KNOWN_HOSTS }}
      IONOS_SSH_PORT: ${{ secrets.IONOS_SSH_PORT }}
      RELEASE_ID: ${{ github.event.workflow_run.head_sha }}
      REMOTE_ARCHIVE: /home/white-gloss-ci/incoming/${{ github.event.workflow_run.head_sha }}.tgz

    steps:
      - name: Deployment-Konfiguration validieren
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in \
            IONOS_SSH_HOST \
            IONOS_SSH_USER \
            IONOS_SSH_PRIVATE_KEY \
            IONOS_SSH_KNOWN_HOSTS
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Erforderliche Produktionskonfiguration fehlt: ${name}" >&2
              exit 1
            fi
          done

      - name: Geprüften main-Stand auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Aktuellen main-Stand bestätigen
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          if [[ "$current_main" != "$RELEASE_ID" ]]; then
            echo "Ein neuerer main-Stand existiert bereits; dieses ältere Deployment wird verworfen." >&2
            exit 1
          fi

      - name: Produktions-Build reproduzieren
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ERPNEXT_BASE_URL: ${{ secrets.ERPNEXT_BASE_URL }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Release-Paket erstellen
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .output/server/index.mjs
          tar -czf release.tgz .output
          sha256sum release.tgz > release.tgz.sha256

      - name: SSH mit festem Hostschlüssel einrichten
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ionos"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$IONOS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ionos"
          printf '%s\n' "$IONOS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          port="${IONOS_SSH_PORT:-22}"
          if [[ ! "$port" =~ ^[0-9]{1,5}$ ]]; then
            echo "IONOS_SSH_PORT ist ungültig" >&2
            exit 1
          fi
          {
            echo "Host ionos-production"
            echo "  HostName $IONOS_SSH_HOST"
            echo "  User $IONOS_SSH_USER"
            echo "  Port $port"
            echo "  IdentityFile $HOME/.ssh/id_ionos"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Release übertragen
        run: scp release.tgz "ionos-production:${REMOTE_ARCHIVE}"

      - name: Übertragung und privilegierten Helfer verifizieren
        shell: bash
        run: |
          set -Eeuo pipefail
          local_archive_sha="$(cut -d ' ' -f 1 release.tgz.sha256)"
          remote_archive_sha="$(
            ssh ionos-production "sha256sum '${REMOTE_ARCHIVE}'" | cut -d ' ' -f 1
          )"
          [[ "$remote_archive_sha" == "$local_archive_sha" ]] || {
            echo "Die Prüfsumme des übertragenen Release-Pakets stimmt nicht." >&2
            exit 1
          }

          local_helper_sha="$(sha256sum scripts/deploy-ionos-release.sh | cut -d ' ' -f 1)"
          remote_helper_sha="$(
            ssh ionos-production "sha256sum /usr/local/sbin/white-gloss-deploy" |
              cut -d ' ' -f 1
          )"
          [[ "$remote_helper_sha" == "$local_helper_sha" ]] || {
            echo "Der root-eigene Deployment-Helfer weicht vom geprüften Repository-Stand ab." >&2
            exit 1
          }

          local_unit_sha="$(sha256sum ops/white-gloss.service | cut -d ' ' -f 1)"
          remote_unit_sha="$(
            ssh ionos-production "sha256sum /etc/systemd/system/white-gloss.service" |
              cut -d ' ' -f 1
          )"
          [[ "$remote_unit_sha" == "$local_unit_sha" ]] || {
            echo "Die installierte systemd-Unit weicht vom geprüften Repository-Stand ab." >&2
            exit 1
          }

      - name: Release atomar aktivieren
        id: activate
        shell: bash
        run: |
          set -Eeuo pipefail
          previous_release="$({
            ssh ionos-production \
              "sudo -n /usr/local/sbin/white-gloss-deploy activate ${RELEASE_ID} ${REMOTE_ARCHIVE}"
          })"
          if [[ -n "$previous_release" && ! "$previous_release" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Der Server lieferte eine ungültige vorherige Release-ID" >&2
            exit 1
          fi
          echo "previous_release=$previous_release" >> "$GITHUB_OUTPUT"

      - name: Live-Smoke-Test
        id: smoke
        continue-on-error: true
        run: node scripts/smoke-production.mjs
        env:
          SMOKE_BASE_URL: https://white-gloss.de
          SMOKE_TIMEOUT_MS: "15000"

      - name: Bei fehlgeschlagenem Smoke-Test zurückrollen
        if: steps.smoke.outcome == 'failure' && steps.activate.outputs.previous_release != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh ionos-production \
            "sudo -n /usr/local/sbin/white-gloss-deploy rollback ${{ steps.activate.outputs.previous_release }}"

          SMOKE_BASE_URL=https://white-gloss.de \
            SMOKE_TIMEOUT_MS=15000 \
            node scripts/smoke-production.mjs

      - name: Aktive Release-ID bestätigen
        if: steps.smoke.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          active_release="$(
            ssh ionos-production "basename \"\$(readlink -f /srv/white-gloss-current)\""
          )"
          [[ "$active_release" == "$RELEASE_ID" ]] || {
            echo "Der aktive Serverstand entspricht nicht dem geprüften Commit." >&2
            exit 1
          }

      - name: Deployment bei fehlgeschlagenem Smoke-Test abbrechen
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Der Live-Smoke-Test ist fehlgeschlagen; ein vorhandenes vorheriges Release wurde reaktiviert." >&2
          exit 1

      - name: Temporäre Serverdatei entfernen
        if: always()
        run: ssh ionos-production "rm -f '${REMOTE_ARCHIVE}'" || true
