name: Deploy to IONOS VPS

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ionos-production
  cancel-in-progress: false

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production

    env:
      IONOS_SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
      IONOS_SSH_USER: ${{ secrets.IONOS_SSH_USER }}
      IONOS_SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}
      IONOS_SSH_KNOWN_HOSTS: ${{ secrets.IONOS_SSH_KNOWN_HOSTS }}
      IONOS_SSH_PORT: ${{ secrets.IONOS_SSH_PORT }}

    steps:
      - name: Deployment-Konfiguration validieren
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in \
            IONOS_SSH_HOST \
            IONOS_SSH_USER \
            IONOS_SSH_PRIVATE_KEY \
            IONOS_SSH_KNOWN_HOSTS
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Erforderliche Produktionskonfiguration fehlt: ${name}" >&2
              exit 1
            fi
          done

      - name: SSH mit festem Hostschlüssel einrichten
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ionos"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$IONOS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ionos"
          printf '%s\n' "$IONOS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          port="${IONOS_SSH_PORT:-22}"
          if [[ ! "$port" =~ ^[0-9]{1,5}$ ]]; then
            echo "IONOS_SSH_PORT ist ungültig" >&2
            exit 1
          fi
          {
            echo "Host ionos-production"
            echo "  HostName $IONOS_SSH_HOST"
            echo "  User $IONOS_SSH_USER"
            echo "  Port $port"
            echo "  IdentityFile $HOME/.ssh/id_ionos"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Produktionsstand lesend prüfen
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh ionos-production 'bash -s' <<'EOS'
          set -Eeuo pipefail
          echo "inspect_user=$(whoami)"
          echo "inspect_host=$(hostname)"
          echo "inspect_time_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          current_link="/srv/white-gloss-current"
          if current_path="$(readlink -f "$current_link" 2>/dev/null)"; then
            echo "current_path_ok=yes"
            echo "current_release=$(basename "$current_path")"
          else
            echo "current_path_ok=no"
            echo "current_release="
          fi
          echo "current_link_stat=$(stat -c '%U:%G %a %N' "$current_link" 2>/dev/null || echo unreadable)"

          echo "service_active=$(systemctl is-active white-gloss.service 2>/dev/null || echo unknown)"
          systemctl show white-gloss.service \
            -p MainPID,ActiveState,SubState,FragmentPath,WorkingDirectory,User,NRestarts,ActiveEnterTimestamp,ExecMainStartTimestamp,Result \
            --no-pager 2>/dev/null || echo "service_show=denied"

          main_pid="$(systemctl show white-gloss.service -p MainPID --value 2>/dev/null || true)"
          if [[ "$main_pid" =~ ^[1-9][0-9]*$ ]]; then
            echo "main_pid=$main_pid"
            echo "main_lstart=$(ps -o lstart= -p "$main_pid" 2>/dev/null || echo unknown)"
            echo "main_etime=$(ps -o etime= -p "$main_pid" 2>/dev/null || echo unknown)"
            echo "main_cwd=$(readlink -f "/proc/$main_pid/cwd" 2>/dev/null || echo unreadable)"
            echo "main_exe=$(readlink -f "/proc/$main_pid/exe" 2>/dev/null || echo unreadable)"
            cmdline="$(tr "\0" " " < "/proc/$main_pid/cmdline" 2>/dev/null || true)"
            echo "main_cmdline=${cmdline:0:200}"
          else
            echo "main_pid=unavailable"
          fi

          echo "local_http=$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 5 http://127.0.0.1:3000/ || echo fail)"

          set +e
          listen_line="$(ss -ltn 2>/dev/null | grep 3000 | head -n 1 || true)"
          echo "listen_3000=${listen_line:-none}"
          postgres_tcp="$(ss -tn 2>/dev/null | awk '{print $5}' | awk -F: '{print $NF}' | grep -E '^(5432|6543)$' | wc -l | tr -d ' ' || true)"
          echo "postgres_like_estab=${postgres_tcp:-0}"
          postgres_unix="$(ss -lxn 2>/dev/null | grep postgres | wc -l | tr -d ' ' || true)"
          echo "postgres_unix_sockets=${postgres_unix:-0}"
          echo "postgres_run_dir=$(ls /var/run/postgresql 2>/dev/null | wc -l | tr -d ' ' || echo 0)"

          echo "envfile_exists=$(test -e /etc/white-gloss/environment && echo yes || echo no)"
          echo "envfile_readable=$(test -r /etc/white-gloss/environment && echo yes || echo no)"
          echo "etc_dir_stat=$(stat -c '%U:%G %a' /etc/white-gloss 2>/dev/null || echo unreadable)"
          echo "envfile_stat=$(stat -c '%U:%G %a' /etc/white-gloss/environment 2>/dev/null || echo unreadable)"
          echo "unit_envfiles=$(systemctl show white-gloss.service -p EnvironmentFiles --value 2>/dev/null || echo unavailable)"
          unit_env_keys="$(systemctl show white-gloss.service -p Environment --value 2>/dev/null | tr ' ' '\n' | awk -F= 'NF{print $1}' | paste -sd, - || true)"
          echo "unit_env_keys=${unit_env_keys:-none}"

          echo "timer_active=$(systemctl is-active white-gloss-reminder.timer 2>/dev/null || echo unknown)"
          echo "timer_enabled=$(systemctl is-enabled white-gloss-reminder.timer 2>/dev/null || echo unknown)"
          echo "timer_unit=$(test -e /etc/systemd/system/white-gloss-reminder.timer && echo exists || echo missing)"
          systemctl show white-gloss-reminder.timer \
            -p LastTriggerUSec,NextElapseUSec,Triggers,Unit \
            --no-pager 2>/dev/null || echo "timer_show=denied"
          reminder_active="$(systemctl is-active white-gloss-reminder.service 2>/dev/null || true)"
          echo "reminder_service=${reminder_active:-unknown}"
          systemctl show white-gloss-reminder.service \
            -p Result,ExecMainStatus,ExecMainCode,ExecMainStartTimestamp \
            --no-pager 2>/dev/null || echo "reminder_show=denied"
          echo "journal_unit_readable=$(journalctl -u white-gloss.service -n 1 --no-pager >/dev/null 2>&1 && echo yes || echo no)"
          echo "release_journal=$(journalctl -u white-gloss.service --since '2026-09-10 06:50:00 UTC' --no-pager -o cat 2>/dev/null | grep -E '\\[release\\]' | tail -n 20 | tr '\\n' '|' | head -c 800)"
          echo "reminder_journal=$(journalctl -u white-gloss-reminder.service -n 8 --no-pager -o cat 2>/dev/null | tr '\\n' '|' | head -c 800)"
          postgres_peers="$(ss -tn 2>/dev/null | awk '$5 ~ /:(5432|6543)$/ {print $5}' | sort -u || true)"
          peer_kinds=""
          peer_count=0
          if [[ -n "$postgres_peers" ]]; then
            while IFS= read -r peer; do
              [[ -z "$peer" ]] && continue
              peer_count=$((peer_count + 1))
              host="${peer%:*}"
              port="${peer##*:}"
              host_lc="$(printf '%s' "$host" | tr 'A-Z' 'a-z')"
              case "$host_lc" in
                127.0.0.1|::1|localhost) kind=localhost ;;
                *supabase.co*) kind=supabase ;;
                *neon.tech*) kind=neon ;;
                *) kind=other ;;
              esac
              hash="$(printf '%s' "$host_lc" | sha256sum | cut -c1-12)"
              peer_kinds="${peer_kinds}${peer_kinds:+,}kind:${kind}:port:${port}:hash:${hash}"
            done <<< "$postgres_peers"
          fi
          echo "postgres_peer_count=${peer_count}"
          echo "postgres_peer_kinds=${peer_kinds:-none}"

          for sha in \
            3fe08020a4d1f1e6a7abb7548a8999defb75871b \
            6719b507ecfd8e11d2896d010ee77af1b5e3732f \
            38a6894792735e0eedce78e632d36622595762cb \
            2926846a680dba134ed53bff673bce83979b2070 \
            bb1b87106ee3919431e2c0203e5f2c74951c3078 \
            08aed32a090815467560d7c453c79498e420a839
          do
            path="/srv/white-gloss-releases/$sha"
            if [[ -e "$path" ]]; then
              echo "release_dir $sha exists"
            else
              echo "release_dir $sha missing_or_unreadable"
            fi
          done

          echo "server_index_readable=$(test -r /srv/white-gloss-current/.output/server/index.mjs && echo yes || echo no)"
          if test -r /srv/white-gloss-current/.output/server/index.mjs; then
            echo "server_roapp_symbols=$(grep -c 'roapp_sync' /srv/white-gloss-current/.output/server/index.mjs || true)"
          fi
          admin_html="$(curl --silent --max-time 5 http://127.0.0.1:3000/admin/odoo || true)"
          admin_asset="$(printf '%s' "$admin_html" | tr -d '\000' | grep -oE '/assets/admin\.odoo-[^" ]+\.js' | head -n 1 || true)"
          echo "admin_odoo_asset=${admin_asset:-none}"
          if [[ -n "${admin_asset:-}" ]]; then
            echo "public_ro_asset=$(curl --silent --max-time 5 "http://127.0.0.1:3000${admin_asset}" | tr -d '\000' | grep -c 'Buchungen nach RO App' || true)"
          else
            echo "public_ro_asset=0"
          fi

          if [[ "${main_pid:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "environ_readable=$(test -r "/proc/$main_pid/environ" && echo yes || echo no)"
            echo "fd_dir_readable=$(test -r "/proc/$main_pid/fd" && echo yes || echo no)"
            if test -r "/proc/$main_pid/environ"; then
              echo "environ_keys=$(tr '\0' '\n' < "/proc/$main_pid/environ" | grep -c '=' || true)"
              probe_env_key() {
                local key="$1"
                local val=""
                val="$(tr '\0' '\n' < "/proc/$main_pid/environ" | awk -F= -v k="$key" '$1==k {print substr($0, index($0,"=")+1); exit}')"
                local name
                name="$(printf '%s' "$key" | tr 'A-Z' 'a-z')"
                if [[ -z "$val" ]]; then
                  echo "env_${name}=present:no length:0"
                  return 0
                fi
                local length="${#val}"
                case "$key" in
                  DATABASE_URL)
                    local proto rest hostport host port path kind db_ok
                    proto="${val%%://*}"
                    rest="${val#*://}"
                    rest="${rest#*@}"
                    hostport="${rest%%/*}"
                    path="${rest#*/}"
                    path="${path%%\?*}"
                    if [[ "$hostport" == \[* ]]; then
                      host="ipv6"
                      port="unknown"
                    elif [[ "$hostport" == *:* ]]; then
                      host="${hostport%%:*}"
                      port="${hostport##*:}"
                    else
                      host="$hostport"
                      port="default"
                    fi
                    host="$(printf '%s' "$host" | tr 'A-Z' 'a-z')"
                    case "$host" in
                      localhost|127.0.0.1|::1) kind=localhost ;;
                      *supabase.co*) kind=supabase ;;
                      *neon.tech*) kind=neon ;;
                      *.internal|*.local) kind=private ;;
                      "") kind=empty_host ;;
                      *) kind=other ;;
                    esac
                    db_ok=no
                    if [[ -n "$path" && "$path" =~ ^[A-Za-z0-9._-]+$ ]]; then
                      db_ok=yes
                    fi
                    echo "env_database_url=present:yes length:${length} proto:${proto} host_kind:${kind} port:${port} db_name_ok:${db_ok}"
                    ;;
                  ROAPP_BRANCH_ID|ROAPP_ASSIGNEE_ID|ROAPP_ORDER_TYPE_ID)
                    if [[ "$val" =~ ^[1-9][0-9]*$ ]]; then
                      echo "env_${name}=present:yes length:${length} int_valid:yes value:${val}"
                    else
                      echo "env_${name}=present:yes length:${length} int_valid:no value:invalid"
                    fi
                    ;;
                  ROAPP_ENTITY_MAP)
                    echo "env_roapp_entity_map=present:yes length:${length} empty:$([[ $length -eq 0 ]] && echo yes || echo no)"
                    ;;
                  HOST)
                    echo "env_host=present:yes length:${length}"
                    ;;
                  *)
                    echo "env_${name}=present:yes length:${length}"
                    ;;
                esac
              }
              probe_env_key DATABASE_URL
              probe_env_key ROAPP_API_KEY
              probe_env_key ROAPP_BRANCH_ID
              probe_env_key ROAPP_ASSIGNEE_ID
              probe_env_key ROAPP_ORDER_TYPE_ID
              probe_env_key ROAPP_ENTITY_MAP
              probe_env_key ROAPP_API_BASE
              probe_env_key REMINDER_CRON_SECRET
              probe_env_key ALLOW_LOCAL_PGLITE
              probe_env_key HOST
              probe_env_key VIBE_API_KEY
              probe_env_key VIBE_API_BASE
            else
              echo "environ_parse=unreadable"
            fi
          fi

          echo "helper_sha=$(sha256sum /usr/local/sbin/white-gloss-deploy 2>/dev/null | cut -d ' ' -f 1 || echo unreadable)"
          echo "unit_sha=$(sha256sum /etc/systemd/system/white-gloss.service 2>/dev/null | cut -d ' ' -f 1 || echo unreadable)"
          echo "sudo_deploy=$(sudo -n /usr/local/sbin/white-gloss-deploy 2>&1 | head -n 1 || true)"
          echo "sudo_list=$(sudo -n -l 2>&1 | tr '\n' ';' | head -c 400)"
          EOS

  deploy:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.IONOS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      IONOS_SSH_HOST: ${{ secrets.IONOS_SSH_HOST }}
      IONOS_SSH_USER: ${{ secrets.IONOS_SSH_USER }}
      IONOS_SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_PRIVATE_KEY }}
      IONOS_SSH_KNOWN_HOSTS: ${{ secrets.IONOS_SSH_KNOWN_HOSTS }}
      IONOS_SSH_PORT: ${{ secrets.IONOS_SSH_PORT }}
      RELEASE_ID: ${{ github.event.workflow_run.head_sha }}
      REMOTE_ARCHIVE: /home/white-gloss-ci/incoming/${{ github.event.workflow_run.head_sha }}.tgz

    steps:
      - name: Deployment-Konfiguration validieren
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in \
            IONOS_SSH_HOST \
            IONOS_SSH_USER \
            IONOS_SSH_PRIVATE_KEY \
            IONOS_SSH_KNOWN_HOSTS
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Erforderliche Produktionskonfiguration fehlt: ${name}" >&2
              exit 1
            fi
          done

      - name: Geprüften main-Stand auschecken
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 5

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Aktuellen main-Stand bestätigen
        id: current_main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          if [[ "$current_main" != "$RELEASE_ID" ]]; then
            echo "Ein neuerer main-Stand existiert bereits; dieses ältere Deployment wird übersprungen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Veraltetes Deployment übersprungen
        if: steps.current_main.outputs.skip == 'true'
        run: echo "Kein Produktionsrelease aktiviert, weil main inzwischen einen neueren Commit enthält."

      - name: Nur-Workflow-Änderungen erkennen
        id: scope
        if: steps.current_main.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --deepen=20 origin main >/dev/null 2>&1 || true
          if git rev-parse --verify --quiet "${RELEASE_ID}^2" >/dev/null; then
            mapfile -t changed < <(git diff --name-only "${RELEASE_ID}^1" "${RELEASE_ID}")
          else
            mapfile -t changed < <(git diff-tree --no-commit-id --name-only -r -m --first-parent "$RELEASE_ID")
          fi
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Keine Dateiliste für diesen Commit; Deployment wird nicht übersprungen."
            exit 0
          fi
          skip=true
          for path in "${changed[@]}"; do
            case "$path" in
              .github/workflows/*) ;;
              *) skip=false; break ;;
            esac
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Geänderte Dateien:"
          printf '%s\n' "${changed[@]}"
          if [[ "$skip" == "true" ]]; then
            echo "Nur Workflow-Dateien geändert; Produktionsrelease und Dienst bleiben unverändert."
          fi

      - name: Produktions-Build reproduzieren
        if: steps.current_main.outputs.skip != 'true' && steps.scope.outputs.skip != 'true'
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ERPNEXT_BASE_URL: ${{ secrets.ERPNEXT_BASE_URL }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Bitrix-Schlüssel ins Release legen
        if: steps.current_main.outputs.skip != 'true' && steps.scope.outputs.skip != 'true'
        env:
          VIBE_API_KEY: ${{ secrets.VIBE_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${VIBE_API_KEY:-}" ]]; then
            echo "Kein GitHub-Secret VIBE_API_KEY; Bitrix bleibt no-op, bis der VPS-Wert gesetzt ist."
            exit 0
          fi
          umask 077
          printf 'VIBE_API_KEY=%s\n' "$VIBE_API_KEY" > .output/runtime-vibe.env
          echo "runtime-vibe.env geschrieben."

      - name: Release-Paket erstellen
        if: steps.current_main.outputs.skip != 'true' && steps.scope.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .output/server/index.mjs
          tar -czf release.tgz .output
          sha256sum release.tgz > release.tgz.sha256

      - name: SSH mit festem Hostschlüssel einrichten
        if: steps.current_main.outputs.skip != 'true' && steps.scope.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_ionos"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$IONOS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ionos"
          printf '%s\n' "$IONOS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          port="${IONOS_SSH_PORT:-22}"
          if [[ ! "$port" =~ ^[0-9]{1,5}$ ]]; then
            echo "IONOS_SSH_PORT ist ungültig" >&2
            exit 1
          fi
          {
            echo "Host ionos-production"
            echo "  HostName $IONOS_SSH_HOST"
            echo "  User $IONOS_SSH_USER"
            echo "  Port $port"
            echo "  IdentityFile $HOME/.ssh/id_ionos"
            echo "  IdentitiesOnly yes"
            echo "  BatchMode yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Release übertragen
        if: steps.current_main.outputs.skip != 'true' && steps.scope.outputs.skip != 'true'
        run: scp release.tgz "ionos-production:${REMOTE_ARCHIVE}"

      - name: Übertragung und privilegierten Helfer verifizieren
        if: steps.current_main.outputs.skip != 'true' && steps.scope.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          local_archive_sha="$(cut -d ' ' -f 1 release.tgz.sha256)"
          remote_archive_sha="$(
            ssh ionos-production "sha256sum '${REMOTE_ARCHIVE}'" | cut -d ' ' -f 1
          )"
          [[ "$remote_archive_sha" == "$local_archive_sha" ]] || {
            echo "Die Prüfsumme des übertragenen Release-Pakets stimmt nicht." >&2
            exit 1
          }

          local_helper_sha="$(sha256sum scripts/deploy-ionos-release.sh | cut -d ' ' -f 1)"
          remote_helper_sha="$(
            ssh ionos-production "sha256sum /usr/local/sbin/white-gloss-deploy" |
              cut -d ' ' -f 1
          )"
          [[ "$remote_helper_sha" == "$local_helper_sha" ]] || {
            echo "Der root-eigene Deployment-Helfer weicht vom geprüften Repository-Stand ab." >&2
            exit 1
          }

          local_unit_sha="$(sha256sum ops/white-gloss.service | cut -d ' ' -f 1)"
          remote_unit_sha="$(
            ssh ionos-production "sha256sum /etc/systemd/system/white-gloss.service" |
              cut -d ' ' -f 1
          )"
          [[ "$remote_unit_sha" == "$local_unit_sha" ]] || {
            echo "Die installierte systemd-Unit weicht vom geprüften Repository-Stand ab." >&2
            exit 1
          }

      - name: Release atomar aktivieren
        id: activate
        if: steps.current_main.outputs.skip != 'true' && steps.scope.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          previous_release="$(
            ssh ionos-production \
              "sudo -n /usr/local/sbin/white-gloss-deploy activate ${RELEASE_ID} ${REMOTE_ARCHIVE}"
          )"
          if [[ -n "$previous_release" && ! "$previous_release" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Der Server lieferte eine ungültige vorherige Release-ID" >&2
            exit 1
          fi
          echo "previous_release=$previous_release" >> "$GITHUB_OUTPUT"

      - name: Live-Smoke-Test
        id: smoke
        if: steps.current_main.outputs.skip != 'true' && steps.scope.outputs.skip != 'true'
        continue-on-error: true
        run: node scripts/smoke-production.mjs
        env:
          SMOKE_BASE_URL: https://white-gloss.de
          SMOKE_TIMEOUT_MS: "15000"

      - name: Bei fehlgeschlagenem Smoke-Test zurückrollen
        if: steps.current_main.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && steps.smoke.outcome == 'failure' && steps.activate.outputs.previous_release != ''
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh ionos-production \
            "sudo -n /usr/local/sbin/white-gloss-deploy rollback ${{ steps.activate.outputs.previous_release }}"

          SMOKE_BASE_URL=https://white-gloss.de \
            SMOKE_TIMEOUT_MS=15000 \
            node scripts/smoke-production.mjs

      - name: Aktive Release-ID bestätigen
        if: steps.current_main.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && steps.smoke.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          active_release="$(
            ssh ionos-production "basename \"\$(readlink -f /srv/white-gloss-current)\""
          )"
          [[ "$active_release" == "$RELEASE_ID" ]] || {
            echo "Der aktive Serverstand entspricht nicht dem geprüften Commit." >&2
            exit 1
          }

      - name: Deployment bei fehlgeschlagenem Smoke-Test abbrechen
        if: steps.current_main.outputs.skip != 'true' && steps.scope.outputs.skip != 'true' && steps.smoke.outcome == 'failure'
        run: |
          echo "Der Live-Smoke-Test ist fehlgeschlagen; ein vorhandenes vorheriges Release wurde reaktiviert." >&2
          exit 1

      - name: Temporäre Serverdatei entfernen
        if: always() && steps.current_main.outputs.skip != 'true' && steps.scope.outputs.skip != 'true'
        run: ssh ionos-production "rm -f '${REMOTE_ARCHIVE}'" || true
