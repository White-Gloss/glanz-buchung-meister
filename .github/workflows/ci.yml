name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Kann der versionierte Stand die Datenbank ueberhaupt herstellen?
  #
  # Migrationen werden von Hand eingespielt. Legt jemand eine Tabelle direkt
  # in der Supabase-Oberflaeche an, laeuft die Anwendung weiter — nur der
  # Wiederaufbau ginge schief, und zwar unbemerkt. Genau das war passiert:
  # zwei Tabellen fehlten, eine spaetere Migration brach deshalb mittendrin
  # ab, und alles nach der Abbruchstelle blieb stillschweigend aus.
  #
  # Laeuft neben `verify`, nicht darin: der Datenbankdienst soll nicht bei
  # jedem Lint-Lauf mitstarten.
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Bewusst der Versions-Tag und keine feste Prüfsumme: das Abbild
        # dient nur dem Test, und eine veraltete Prüfsumme wuerde die CI
        # blockieren, ohne dass jemand etwas davon haette.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: PostgreSQL-Client bereitstellen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Datenbank aus den Migrationen aufbauen
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run check:migrations

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      - name: Produktionsabhängigkeiten prüfen
        run: npm audit --omit=dev --audit-level=moderate

      - name: Codequalität prüfen
        run: npm run lint

      # Vor dem Build, damit ein veralteter eingecheckter Route-Tree hier
      # auffällt und nicht erst auf einem fremden Rechner. Der Build würde die
      # Datei neu schreiben und den Fehler damit verdecken.
      - name: Typen der Anwendung prüfen
        run: npm run typecheck

      # Die Edge Functions laufen unter Deno und liegen ausserhalb von
      # tsconfig.json — ohne diesen Schritt pruefte sie niemand.
      - name: Typen der Edge Functions prüfen
        run: npm run typecheck:functions

      - name: Automatisierte Tests ausführen
        run: npm test

      - name: Qualitätsskripte syntaktisch prüfen
        run: |
          bash -n scripts/deploy-ionos-release.sh
          node --check scripts/smoke-production.mjs
          node --check scripts/audit-domain-migration.mjs
          node --check lighthouserc.mobile.cjs
          node --check lighthouserc.desktop.cjs
          bash -n scripts/check-migrations.sh

      - name: Produktions-Build erstellen
        run: npm run build
