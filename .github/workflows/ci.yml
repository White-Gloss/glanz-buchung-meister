name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Node.js einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci --ignore-scripts

      - name: Produktionsabhängigkeiten prüfen
        run: npm audit --omit=dev --audit-level=moderate

      - name: Codequalität prüfen
        run: npm run lint

      - name: Qualitätsskripte syntaktisch prüfen
        run: |
          node --check scripts/smoke-production.mjs
          node --check scripts/audit-domain-migration.mjs
          node --check lighthouserc.mobile.cjs
          node --check lighthouserc.desktop.cjs

      - name: Produktions-Build erstellen
        run: npm run build
